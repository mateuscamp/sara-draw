# The same gate as `make check` on the agent's machine and in its Stop hook (ADR-0005).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: uv, pinned to the version the lock was made with
        run: python -m pip install uv==0.11.9
      - name: gate
        run: make check
