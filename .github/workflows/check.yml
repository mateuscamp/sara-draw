# The same gate as `make check` on the agent's machine and in its Stop hook (ADR-0005).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the library supports (requires-python) and the one in .python-version.
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # Pinned by commit, not by tag: a tag can be moved to other code (audit B9).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # the bench compares its score with the parent commit's
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: uv, pinned to the version the lock was made with
        run: python -m pip install uv==0.11.9
      - name: gate
        run: make check
