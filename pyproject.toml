[project]
name = "ai-draw"
version = "0.0.0"
description = "Vector drawing for Python with two outputs: smooth antialiasing and rule-abiding pixel art."
readme = "README.md"
authors = [{ name = "Mateus Campelo" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "pillow>=11"]

[project.urls]
Repository = "https://github.com/mateuscamp/ai-draw"

[project.scripts]
ai-draw = "ai_draw.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "fonttools>=4.60",
    "freetype-py>=2.5",
    "pytest>=8.4",
    "ruff>=0.13",
    "scikit-image>=0.25",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the SPDX header is the notice; tests/architecture enforces it (ADR-0003)
    "D203",   # D211 wins: no blank line before class docstring
    "D401",   # docstrings of values and properties read better as nouns ("The color at...")
    "D213",   # D212 wins: summary on the first docstring line
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # AGENTS.md: imports are absolute

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["INP001"] # examples are scripts run by ai-draw, not a package
"docs/gallery/**" = ["INP001", "T201"] # scripts that build the README's picture and table
"tests/**" = [
    "S101",   # assert is how pytest checks
    "D",      # test names say what they check
    "INP001", # tests/ is not a package
    "PLR2004", # literal expected values are the point of a test
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["src", "tests", "examples"]
extraPaths = ["tests/support"]
# pytest fixtures and test functions are called by name, never imported
reportUnusedFunction = "none"

[tool.pytest.ini_options]
# src/ too: the >>> examples in docstrings run as tests, so they cannot rot
testpaths = ["tests", "src"]
addopts = ["-q", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
# shared test code (architecture rules, bench shapes) lives here, importable by name
pythonpath = ["tests/support"]
xfail_strict = true
