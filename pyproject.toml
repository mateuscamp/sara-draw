[project]
name = "ai-draw"
version = "0.0.0"
description = "Vector drawing for Python with two outputs: smooth antialiasing and rule-abiding pixel art."
readme = "README.md"
authors = [{ name = "Mateus Campelo" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "pillow>=11"]

[project.urls]
Repository = "https://github.com/mateuscamp/ai-draw"

[project.scripts]
ai-draw = "ai_draw.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "fonttools>=4.60",
    "freetype-py>=2.5",
    "hypothesis>=6.170",
    "pytest>=8.4",
    "ruff>=0.13",
    "scikit-image>=0.25",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# First-party code, the same whether ruff finds this file or is handed it (audit G2).
src = ["src", "tests/support"]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "CPY001", # the SPDX header is the notice; tests/architecture enforces it (ADR-0003)
    "D203",   # D211 wins: no blank line before class docstring
    "D401",   # docstrings of values and properties read better as nouns ("The color at...")
    "D213",   # D212 wins: summary on the first docstring line
]

[tool.ruff.lint.mccabe]
max-complexity = 8  # python-on-rails (ADR-0005)

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all" # AGENTS.md: imports are absolute

# Config lida num lugar só: fora do config.py, ler o ambiente reprova. Repassar o ambiente a um
# subprocesso é legítimo e leva `# noqa: TID251  # motivo: ...`.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.environb".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.getenv".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."
"os.getenvb".msg = "Só o config.py lê o ambiente; o resto recebe o objeto de config."

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["INP001"] # examples are scripts run by ai-draw, not a package
"docs/gallery/**" = ["INP001", "T201"] # scripts that build the README's picture and table
"tests/**" = [
    "S101",   # assert is how pytest checks
    "D",      # test names say what they check
    "INP001", # tests/ is not a package
    "PLR2004", # literal expected values are the point of a test
]

[tool.basedpyright]
typeCheckingMode = "all"            # stricter than the trail's "recommended" (ADR-0005)
pythonVersion = "3.11"              # a library: the oldest Python it supports (ADR-0005)
include = ["src", "tests", "examples", "docs"]
extraPaths = ["tests/support", "docs/gallery"]
enableTypeIgnoreComments = false    # only `# pyright: ignore[rule]`, which names the rule
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
failOnWarnings = true               # a warning must fail the gate, not exit 0

[tool.pytest.ini_options]
# src/ too: the >>> examples in docstrings run as tests, so they cannot rot
testpaths = ["tests", "src"]
addopts = [
    "-q", "-ra", "--strict-markers", "--strict-config", "--import-mode=importlib",
    "--doctest-modules",
]
filterwarnings = ["error"]   # a deprecation fails today instead of breaking tomorrow
# shared test code (architecture rules, bench shapes) lives here, importable by name
pythonpath = ["tests/support"]
xfail_strict = true
